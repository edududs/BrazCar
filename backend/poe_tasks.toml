[tasks.format]
help = "Format the code"
cmd = "ruff format"

[tasks.lint]
help = "Lint and apply safe fixes"
cmd = "ruff check --fix"

[tasks.types]
help = "Type check"
cmd = "pyright"

[tasks.test]
help = "Fast tests: domain, architecture, contract drift"
cmd = "pytest -m 'not heavy'"

[tasks.migrations-check]
help = "Fail if a model changed without a migration (D-126, D-132). No real secret needed: DJANGO_DEBUG turns the dev key on"
cmd = "python manage.py makemigrations --check --dry-run"
env = { DJANGO_DEBUG.default = "1" }

[tasks.coverage]
help = "Fast tests again, measuring coverage. Prints the summary and fails below the floor"
cmd = "pytest -m 'not heavy' --cov=src/brazcar --cov-report=term-missing:skip-covered --cov-fail-under=87"

[tasks.test-heavy]
help = "Every test, including the ones that need external services"
cmd = "pytest"

[tasks.test-postgres]
help = "Port contracts again, on Postgres (D-039). Same POSTGRES_* as compose.yml, from ../.env; needs `docker compose --profile postgres up -d` locally, already a service of the runner on GitHub (D-132)"
cmd = "pytest -m contract"
envfile = "../.env"
env = { POSTGRES_DB.default = "brazcar", POSTGRES_USER.default = "brazcar", POSTGRES_PASSWORD.default = "brazcar", POSTGRES_PORT.default = "5432", DATABASE_URL = "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}", EXPECT_DB_VENDOR = "postgresql" }

[tasks.test-golden]
help = "Measure the interpreter on the golden set against an Ollama (D-120): OLLAMA_BASE_URL and RIDE_PARSER_MODEL"
cmd = "pytest tests/importing/test_golden.py -m heavy -s"
envfile = "../.env"
env = { OLLAMA_BASE_URL.default = "http://127.0.0.1:11434", RIDE_PARSER_MODEL.default = "qwen3.5:4b", PYTHONIOENCODING = "utf-8" }

[tasks.fix]
help = "Pipeline to run before calling work done"
sequence = ["format", "lint", "types"]

[tasks.check]
help = "Fast gate, changes nothing: format, lint, types, fast tests, migration drift"
sequence = [
    { cmd = "ruff format --check" },
    { cmd = "ruff check" },
    { ref = "types" },
    { ref = "test" },
    { ref = "migrations-check" },
]

[tasks.check-heavy]
help = "Heavy gate (D-132): the fast gate, every test, and the contracts on Postgres. Runs on GitHub and on demand locally"
sequence = ["check", "test-heavy", "test-postgres"]

[tasks.openapi]
help = "Regenerate the API contract consumed by web/"
cmd = "python manage.py export_openapi_schema --api brazcar.config.api.api --output ../contract/openapi.json --indent 2 --sorted"
env = { DJANGO_DEBUG.default = "1" }

[tasks.serve]
help = "Run the API locally with reload"
cmd = "uvicorn brazcar.config.asgi:application --reload"
envfile = "../.env"
env = { DJANGO_DEBUG.default = "1" }

[tasks.hooks]
help = "Point git at the versioned hooks"
cmd = "git config core.hooksPath .githooks"
