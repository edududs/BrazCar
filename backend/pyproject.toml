[project]
name = "brazcar"
version = "0.5.0"
description = "Ride board between Brazlandia and downtown Brasilia."
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0,<6.1",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "hypothesis>=6.168.0",
    "poethepoet>=0.48.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]
