# Deploy on the test machine (D-060): API, the WhatsApp worker and their own Postgres behind the
# Traefik the machine already runs. The box is this file, the env file and the volume. Nothing is
# built here: the images come from GHCR (D-067). Development uses the compose.yml at the repo root.
# How to use it: docs/runbooks/deploy.md
name: brazcar

services:
  api:
    image: ghcr.io/edududs/brazcar-api:${BRAZCAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    # The env file lives outside the repo, on the host. BRAZCAR_ENV_FILE lets the same compose serve
    # another machine without editing this file.
    env_file:
      - ${BRAZCAR_ENV_FILE:-~/.brazcar/api.env}
    environment:
      # Only the API migrates; the worker must not set this (D-061).
      RUN_MIGRATIONS: "1"
      # uvicorn honours X-Forwarded-* only from this list. Traefik arrives through the `web` network
      # with an address that changes on every recreate, hence `*`. Topology, not application config.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal
    labels:
      traefik.enable: "true"
      # Required because the container sits on two networks; otherwise Traefik may pick the wrong one.
      traefik.docker.network: web
      traefik.http.routers.brazcar-api.rule: Host(`api-brazcar.elj-labs.org`)
      # `web` is Traefik's plain HTTP entrypoint, bound to 127.0.0.1:80. TLS ends at the Cloudflare tunnel.
      traefik.http.routers.brazcar-api.entrypoints: web
      traefik.http.services.brazcar-api.loadbalancer.server.port: "8000"
      # The public scheme is https, but Traefik's HTTP entrypoint would report http to the API.
      traefik.http.middlewares.brazcar-public-scheme.headers.customrequestheaders.X-Forwarded-Proto: https
      traefik.http.routers.brazcar-api.middlewares: brazcar-public-scheme
    # No healthcheck here: the image brings its own (/api/health).

  # The WhatsApp extractor, one process for one paired account (D-108). Same image as the API,
  # another command; it waits for the API so the migrations have run. Pairing, once:
  #   docker compose run --rm worker python manage.py pair_whatsapp
  worker:
    image: ghcr.io/edududs/brazcar-api:${BRAZCAR_IMAGE_TAG:-latest}
    command: ["python", "manage.py", "run_extractor"]
    restart: unless-stopped
    env_file:
      - ${BRAZCAR_ENV_FILE:-~/.brazcar/api.env}
    # Ollama runs natively on the host; the container reaches it by this name (D-108).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      disable: true  # the image's healthcheck is the API's; the worker serves no HTTP

  postgres:
    # The official image plus pg_cron, built from infra/postgres and published with the API (D-119).
    image: ghcr.io/edududs/brazcar-postgres:${BRAZCAR_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Same env file: Postgres reads POSTGRES_* and ignores the rest.
    env_file:
      - ${BRAZCAR_ENV_FILE:-~/.brazcar/api.env}
    networks:
      # No `web` and no `ports`: only the API and the worker reach the database.
      - internal
    volumes:
      # Since 18 the official image keeps data under a versioned subdirectory; mount the root.
      - brazcar-postgres-data:/var/lib/postgresql
    healthcheck:
      # `$$` defers expansion to the container shell, where the env file values exist.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # Traefik's. Used, never created here.
  web:
    external: true
  internal:

volumes:
  brazcar-postgres-data:
    name: brazcar-postgres-data
