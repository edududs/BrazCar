name: web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "contract/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "contract/**", ".github/workflows/web.yml"]

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Away from the board's own zone (America/Sao_Paulo, D-094) on purpose, so a screen that
      # reads the device's clock instead of the board's fails here, not just on a phone abroad.
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      # Heavy gate (D-132): the fast checks plus the production build, now that the pre-push hook
      # is gone.
      - run: yarn run check:heavy
      # Coverage is measured here, not on the local gate, so committing stays fast. No third-party
      # service reads it (D-008): the summary goes to the log and the floor is in vite.config.ts.
      - run: yarn run coverage
